services:
  - type: web
    name: maquinadeleads-homolog-api
    runtime: docker
    plan: free
    rootDir: maquina-de-leads/backend
    dockerfilePath: ./Dockerfile
    dockerCommand: npm start
    preDeployCommand: npm run migrate
    autoDeployTrigger: off
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: maquinadeleads-homolog-db
          property: connectionString
      - key: PGSSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: FRONTEND_URL
        sync: false
      - key: SEARXNG_URL
        sync: false

  - type: web
    name: maquinadeleads-homolog-web
    runtime: static
    rootDir: maquina-de-leads/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: off
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: maquinadeleads-homolog-db
    plan: free
    postgresMajorVersion: "15"
