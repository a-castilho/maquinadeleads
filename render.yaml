services:
  - type: web
    name: maquinadeleads-homolog-api
    runtime: docker
    plan: free
    rootDir: maquina-de-leads/backend
    dockerfilePath: ./Dockerfile
    dockerCommand: npm start
    autoDeployTrigger: checksPass
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: PGSSL
        value: "true"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: RUN_WORKER
        value: "true"
      - key: SEARXNG_URL
        sync: false

  - type: web
    name: maquinadeleads-homolog-web
    runtime: static
    rootDir: maquina-de-leads/frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: checksPass
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
