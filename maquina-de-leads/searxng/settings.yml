use_default_settings: true

server:
  secret_key: "maquina_de_leads_searxng_secret_key"
  limiter: false
  image_proxy: false
  method: "GET"
  default_http_headers:
    X-Requested-With: XMLHttpRequest
    Accept-Language: "pt-BR,pt;q=0.9,en-US;q=0.8,en;q=0.7"
    Accept: "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8"

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  default_lang: "pt-BR"
  formats:
    - html
    - json
  paging: true
  time_range: ""
  max_page: 10

outgoing:
  request_timeout: 10.0
  max_request_timeout: 15.0
  pool_connections: 100
  pool_maxsize: 100
  enable_http2: true
  retries: 2

engines:
  - name: google
    engine: google
    shortcut: g
    timeout: 5.0
    disabled: false

