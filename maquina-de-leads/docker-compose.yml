version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: maquina-de-leads-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-leads_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-maquina_de_leads_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-maquina_de_leads}
    ports:
      - "5432:5432"
    networks:
      - maquina-de-leads
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-leads_user} -d ${POSTGRES_DB:-maquina_de_leads}"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maquina-de-leads-migrate
    restart: "no"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-leads_user}:${POSTGRES_PASSWORD:-maquina_de_leads_dev_password}@postgres:5432/${POSTGRES_DB:-maquina_de_leads}
      PGSSL: "false"
    command: ["npm", "run", "migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - maquina-de-leads

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maquina-de-leads-backend
    restart: unless-stopped
    environment:
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-dev_only_jwt_secret_change_before_production_1234567890abcdef}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      DATABASE_URL: postgres://${POSTGRES_USER:-leads_user}:${POSTGRES_PASSWORD:-maquina_de_leads_dev_password}@postgres:5432/${POSTGRES_DB:-maquina_de_leads}
      PGSSL: "false"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - maquina-de-leads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maquina-de-leads-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api}
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - maquina-de-leads

  searxng:
    image: searxng/searxng:latest
    container_name: maquina-de-leads-searxng
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - maquina-de-leads
    volumes:
      - ./searxng:/etc/searxng

networks:
  maquina-de-leads:
    driver: bridge

volumes:
  postgres_data:
