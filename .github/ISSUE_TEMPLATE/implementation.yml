name: Implementação ou mudança
description: Registrar correção, melhoria ou nova funcionalidade com critérios verificáveis
title: "[Implementação] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Contexto / problema
      description: O que acontece hoje e por que precisa mudar?
    validations:
      required: true
  - type: textarea
    id: objective
    attributes:
      label: Objetivo
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: Estado atual / o que está na tela
      description: Descreva tela, rota, fluxo, API ou comportamento atual; anexe imagem quando útil.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado / o que deve aparecer
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Critérios de aceite
      placeholder: "- [ ] Critério 1\n- [ ] Critério 2"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Escopo, riscos e dependências
  - type: textarea
    id: evidence
    attributes:
      label: Evidências atuais
      description: Screenshots, logs, API ou outra evidência para comparação posterior.
