name: Deploy Homolog

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maquinadeleads-homolog
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: homologation
    steps:
      - name: Resolve tested commit
        id: commit
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "sha=${{ github.event.workflow_run.head_sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate deploy hooks
        env:
          BACKEND_HOOK: ${{ secrets.RENDER_HOMOLOG_BACKEND_DEPLOY_HOOK }}
          FRONTEND_HOOK: ${{ secrets.RENDER_HOMOLOG_FRONTEND_DEPLOY_HOOK }}
        shell: bash
        run: |
          test -n "$BACKEND_HOOK" || { echo "::error::RENDER_HOMOLOG_BACKEND_DEPLOY_HOOK is not configured"; exit 1; }
          test -n "$FRONTEND_HOOK" || { echo "::error::RENDER_HOMOLOG_FRONTEND_DEPLOY_HOOK is not configured"; exit 1; }

      - name: Deploy backend to Render homologation
        env:
          HOOK: ${{ secrets.RENDER_HOMOLOG_BACKEND_DEPLOY_HOOK }}
          SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          SEP='?'; [[ "$HOOK" == *'?'* ]] && SEP='&'
          curl --fail --show-error --silent --retry 3 --retry-delay 5 --request POST "${HOOK}${SEP}ref=${SHA}"
          echo
          echo "Backend deploy requested for ${SHA}"

      - name: Deploy frontend to Render homologation
        env:
          HOOK: ${{ secrets.RENDER_HOMOLOG_FRONTEND_DEPLOY_HOOK }}
          SHA: ${{ steps.commit.outputs.sha }}
        shell: bash
        run: |
          SEP='?'; [[ "$HOOK" == *'?'* ]] && SEP='&'
          curl --fail --show-error --silent --retry 3 --retry-delay 5 --request POST "${HOOK}${SEP}ref=${SHA}"
          echo
          echo "Frontend deploy requested for ${SHA}"

      - name: Homologation summary
        shell: bash
        run: |
          echo "### Máquina de Leads · Homologação" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ steps.commit.outputs.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Backend: deploy solicitado à Render" >> "$GITHUB_STEP_SUMMARY"
          echo "- Frontend: deploy solicitado à Render" >> "$GITHUB_STEP_SUMMARY"
