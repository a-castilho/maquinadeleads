name: Documentar issues

on:
  issues:
    types: [opened, edited, reopened, closed, labeled, unlabeled, assigned, unassigned, milestoned, demilestoned]
permissions:
  contents: write
  issues: read
concurrency:
  group: issue-documentation-${{ github.event.issue.number }}
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const issue=context.payload.issue, owner=context.repo.owner, repo=context.repo.repo;
            const path=`docs/issues/issue-${issue.number}.md`;
            const labels=(issue.labels||[]).map(l=>typeof l==='string'?l:l.name).filter(Boolean);
            const assignees=(issue.assignees||[]).map(a=>a.login);
            const content=`# Issue #${issue.number} — ${issue.title}\n\n> Documento gerado automaticamente. Edite a issue; este arquivo será sincronizado.\n\n## Metadados\n\n- **Status:** ${issue.state}\n- **Autor:** @${issue.user.login}\n- **Responsáveis:** ${assignees.length?assignees.map(a=>'@'+a).join(', '):'—'}\n- **Labels:** ${labels.length?labels.join(', '):'—'}\n- **Atualizada em:** ${issue.updated_at}\n- **Fonte:** ${issue.html_url}\n\n## Planejado / descrição\n\n${issue.body||'_Sem descrição._'}\n\n## Regra de revisão\n\nA PR deve comparar **planejado x implementado x tela/resultado real** e registrar evidência.\n`;
            let sha; try{const r=await github.rest.repos.getContent({owner,repo,path}); if(!Array.isArray(r.data)) sha=r.data.sha;}catch(e){if(e.status!==404) throw e;}
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,message:`docs(issue): sincroniza issue #${issue.number}`,content:Buffer.from(content).toString('base64'),sha});
